name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # rust-lld crashes with SIGBUS linking crates/orchest's example binaries on
  # the standard runner once orchest-provider's asr/tts features are in the
  # unified feature set (v0.10 demo) — reproduced even fully serial
  # (`cargo build --examples --jobs 1`), so it isn't just concurrency; each
  # link alone is heavy enough (openssl + rusqlite bundled + tokio-tungstenite
  # statically linked). Applied job-wide (not just to that step) so every
  # step shares one profile fingerprint instead of triggering a second,
  # differently-configured rebuild partway through the job.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: Build, Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # swatinem/rust-cache prunes incremental artifacts from target/ before
      # saving, keeping the saved cache small — the previous plain
      # actions/cache config cached target/ verbatim and the post-cache save
      # started failing with "No space left on device" once the workspace's
      # target outgrew the runner disk (PR #223 CI).
      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install ripgrep
        run: sudo apt-get install -y ripgrep

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Python binding package tests
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip maturin pytest
          maturin develop
          python -m pytest python/tests/ -v

      - name: cargo doc (deny warnings)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: cargo build --examples
        run: cargo build --examples --workspace --jobs 1

      - name: TS event wire naming check
        run: bash scripts/check-ts-event-wire-naming.sh

      - name: Supplementary lint checks
        run: bash scripts/lint-check.sh
