      - heading "Everything you need to make music your way" [level=1] [ref=e500]
      - generic [ref=e503]:
        - generic [ref=e506]:
          - heading "10 free songs, daily" [level=3] [ref=e507]
          - generic [ref=e508]: Turn any moment into customized music instantly — from your commute to inside jokes. Express what words can’t. Free forever, no subscription needed.
        - generic [ref=e512]:
          - heading "Free AI music generator" [level=3] [ref=e513]
          - generic [ref=e514]: Discover what’s possible when anyone can make music. Access the market-leading AI song generator to explore millions of songs—remixes, jokes, and raw emotion.
        - generic [ref=e518]:
          - heading "Share it with the world" [level=3] [ref=e519]
          - generic [ref=e520]: Make music that matters to you, then share it with people who’ll feel it too. From your inner circle to millions of music fans, your next track can go far.
      - generic [ref=e524]:
        - generic [ref=e527]:
          - heading "Granular creation controls" [level=3] [ref=e528]
          - generic [ref=e529]: Steer your style with Voices, Inspo, exclusions, and vocal gender. Or get even more granular and experiment with weirdness and style sliders.
        - generic [ref=e533]:
          - heading "Commercial rights to your songs" [level=3] [ref=e534]
          - generic [ref=e535]: Songs you create as a paid Suno subscriber are yours to keep and do whatever you want with them, from using them as background music in videos to publishing an album.
        - generic [ref=e539]:
          - heading "Your complete creative workspace" [level=3] [ref=e540]
          - generic [ref=e541]: Suno Studio is a first-of-its-kind web-based generative audio workstation that combines traditional DAW functionality with AI-powered music creation.
      - generic [ref=e545]:
        - generic [ref=e548]:
          - heading "Experience the modern song maker" [level=3] [ref=e549]
          - generic [ref=e550]: Start, edit, remix—your way. Upload or record your own audio, rewrite lyrics, reorder sections, and reimagine your sound with powerful creative tools.
        - generic [ref=e554]:
          - heading "Create everyday. Keep it all." [level=3] [ref=e555]
          - generic [ref=e556]: Make up to 500 custom songs a month, with full commercial rights on the Pro plan. Get inspired, break genre boundaries, and own what you generate—no strings attached.
        - generic [ref=e560]:
          - heading "Extract stems. Drop into your DAW." [level=3] [ref=e561]
          - generic [ref=e562]: Export up to 12 time-aligned WAV stems and use them seamlessly in Ableton, Logic, or any DAW. Clean, structured, and ready for pro workflows.
