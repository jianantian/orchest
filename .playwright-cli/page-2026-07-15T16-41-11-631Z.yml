    - generic [ref=e997]:
      - generic [ref=e998]:
        - heading "Frequently asked questions" [level=2] [ref=e999]
        - paragraph [ref=e1000]: Everything you need to know about making music with Suno.
      - generic [ref=e1001]:
        - generic [ref=e1002]:
          - heading [level=3] [ref=e1003]:
            - button "Why is Suno the best AI music generator?" [ref=e1004] [cursor=pointer]:
              - generic [ref=e1006]: +
          - paragraph [ref=e1007]: Most AI music generators produce short instrumental loops. Suno helps you create complete, original songs – vocals, lyrics, full production – from a single text prompt in under a minute, across every genre. Featured in Rolling Stone, Billboard, Wired, and Variety, Suno is used by everyone from first-time creators to top producers and songwriters. We're a top 10 music app on iOS and Android.
        - generic [ref=e1008]:
          - heading [level=3] [ref=e1009]:
            - button "How do I make a song with Suno?" [ref=e1010] [cursor=pointer]:
              - generic [ref=e1012]: +
          - paragraph [ref=e1013]: Go to suno.com, describe the song you want – genre, mood, theme, or your own lyrics – and hit Create. Suno helps you build a complete track with vocals, instrumentation, and production in under a minute. Regenerate, extend, or refine from there. Whether you're after a full song or just an instrumental, Suno works as a beat maker, AI song generator and song creator in one.
        - generic [ref=e1014]:
          - heading [level=3] [ref=e1015]:
            - button "Do I need any music experience to use Suno?" [ref=e1016] [cursor=pointer]:
              - generic [ref=e1018]: +
          - paragraph [ref=e1019]: "No experience needed. Suno is built for everyone – people making music for the first time and chart-topping pros alike. Describe what you want in plain language: a genre, a mood, a topic, even a few lyrics. From there, you shape the melody, harmony, vocals, and production into exactly what you're hearing in your head."
        - generic [ref=e1020]:
          - heading [level=3] [ref=e1021]:
            - button "Can I use AI to make music?" [ref=e1022] [cursor=pointer]:
              - generic [ref=e1024]: +
          - paragraph [ref=e1025]: "Yes. With Suno's AI song generator, you can create complete, original songs just by describing what you want. Type a genre, a mood, an idea – \"chill lo-fi beat about rainy mornings\" – and Suno helps you build a full track with vocals, lyrics, and production in seconds. Millions of people are already using AI to make music: for fun, for content, for professional projects."
        - generic [ref=e1026]:
          - heading [level=3] [ref=e1027]:
            - button "Is Suno free to use?" [ref=e1028] [cursor=pointer]:
              - generic [ref=e1030]: +
          - paragraph [ref=e1031]: Yes. Suno is a free AI music generator that lets you create up to 10 songs a day, no credit card required. When you're ready to go further, paid plans unlock more. The Pro plan ($10/month) gives you 500 songs a month, royalty free music, access to v5.5 - Suno's best and most personalized AI music model – commercial use rights, priority generation, the Song Editor, stem separation into vocal and instrument stems, and audio uploads of up to 8 minutes. It's the go-to plan for content creators, songwriters, and anyone looking for royalty free music for YouTube, podcasts, ads, or any commercial project. The Premier plan ($30/month) is built for serious creators and producers. On top of everything in Pro, you get 2,000 songs a month, access to Suno Studio – the first-ever generative audio workstation – a multitrack editor, MIDI export, persona voices, and early access to new features. It's a full AI music production suite in your browser. Both paid plans are available at a 20% discount with annual billing.
