[workspace]
resolver = "2"
members = [
    "crates/orchest-protocol",
    "crates/orchest-provider-core",
    "crates/orchest-provider-http",
    "crates/orchest-provider-stream",
    "crates/orchest-provider-visual",
    "crates/orchest-providers",
    "crates/agent-runtime-model",
    "crates/agent-runtime-core",
    "crates/agent-runtime-aigc-providers",
    "crates/agent-runtime-providers",
    "crates/agent-runtime-py",
    "crates/agent-runtime-node",
    "crates/agent-runtime-asr-providers",
    "crates/agent-runtime-tts-providers",
]

[workspace.lints.clippy]
too_many_lines = "warn"
too_many_arguments = "warn"
result_large_err = "warn"
