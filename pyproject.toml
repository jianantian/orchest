[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "orchest-py"
# Read from crates/orchest-py/Cargo.toml, the single source of the SDK
# version (ADR-0004 D6). maturin converts Cargo pre-releases to PEP 440.
dynamic = ["version"]
description = "Python SDK for Orchest, a skill-first agent runtime with a Rust core"
readme = "python/README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["agent", "llm", "ai", "skills", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jianantian/orchest"
Documentation = "https://github.com/jianantian/orchest/blob/main/docs/guide/sdk-python.md"
Repository = "https://github.com/jianantian/orchest"
Changelog = "https://github.com/jianantian/orchest/blob/main/CHANGELOG-SDK.md"

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/orchest-py/Cargo.toml"
module-name = "orchest.orchest_py"
python-source = "python"
# maturin packs only the crates orchest-py's enabled features reach, but
# Cargo still needs the manifest of every optional path dependency of
# orchest-provider to load the workspace from the sdist.
include = [{ path = "crates/orchest-provider-visual/**/*", format = "sdist" }]
