[package]
name = "research-pipeline-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "research-pipeline"
path = "src/main.rs"

[[bin]]
name = "seam-report"
path = "src/bin/seam-report.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
orchest = { path = "../../../crates/orchest" }
orchest-protocol = { path = "../../../crates/orchest-protocol" }
orchest-provider = { path = "../../../crates/orchest-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints]
workspace = true
