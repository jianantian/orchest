[package]
name = "research-pipeline-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "research-pipeline"
path = "src/main.rs"

[[bin]]
name = "seam-report"
path = "src/bin/seam-report.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
orchest = { path = "../../../crates/orchest" }
orchest-protocol = { path = "../../../crates/orchest-protocol" }
orchest-provider = { path = "../../../crates/orchest-provider", features = ["http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
