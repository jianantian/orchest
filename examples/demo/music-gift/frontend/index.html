<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Moment · Music Gift</title>
  <script>
    // Set data-theme before first paint so a pinned light/dark choice (or the
    // OS preference under "auto") never flashes the wrong theme. Mirrors
    // resolveTheme() in src/lib/theme.ts — keep in sync.
    (function () {
      var choice = "auto";
      try {
        var v = localStorage.getItem("moment_theme");
        if (v === "auto" || v === "light" || v === "dark") choice = v;
      } catch (e) {}
      var dark =
        choice === "dark" ||
        (choice === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
