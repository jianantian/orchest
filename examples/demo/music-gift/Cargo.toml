[package]
name = "music-gift-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "music-gift"
path = "src/main.rs"

[dependencies]
orchest = { path = "../../../crates/orchest", features = ["sqlite-session"] }
orchest-protocol = { path = "../../../crates/orchest-protocol" }
orchest-provider = { path = "../../../crates/orchest-provider", features = ["llm", "gen"] }
orchest-provider-http = { path = "../../../crates/orchest-provider-http" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio-stream = "0.1"
chrono = { version = "0.4.45", features = ["clock"] }
tower = "0.5.3"
lettre = { version = "0.11", features = ["tokio1", "tokio1-native-tls"] }
axum-extra = { version = "0.10", features = ["cookie"] }
time = "0.3"
reqwest = { version = "0.12", features = ["json"] }
argon2 = "0.5"

[dev-dependencies]
tempfile = "3"
ureq = { version = "2", features = ["json"] }

[lints]
workspace = true
