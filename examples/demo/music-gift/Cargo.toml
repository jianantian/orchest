[package]
name = "music-gift-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "music-gift"
path = "src/main.rs"

[dependencies]
orchest = { path = "../../../crates/orchest", features = ["sqlite-session"] }
orchest-protocol = { path = "../../../crates/orchest-protocol" }
orchest-provider = { path = "../../../crates/orchest-provider", features = ["llm", "gen"] }
orchest-provider-http = { path = "../../../crates/orchest-provider-http" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
regex-lite = "0.1"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
