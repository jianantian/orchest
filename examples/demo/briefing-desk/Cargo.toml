[package]
name = "briefing-desk-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "briefing-desk"
path = "src/main.rs"

[dependencies]
orchest = { path = "../../../crates/orchest", features = ["sqlite-session"] }
orchest-protocol = { path = "../../../crates/orchest-protocol" }
orchest-provider = { path = "../../../crates/orchest-provider", features = ["asr", "tts", "testing", "llm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
bytes = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
