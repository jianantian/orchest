[package]
name = "briefing-desk-demo"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "briefing-desk"
path = "src/main.rs"

[dependencies]
orchest = { path = "../../../crates/orchest" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
