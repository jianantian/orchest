[package]
name = "orchest-protocol"
description = "Shared protocol for Orchest: content model, capability traits, stream events, capability descriptors and errors."
readme = "README.md"
keywords = ["agent", "llm", "ai", "protocol", "streaming"]
categories = ["artificial-intelligence", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
bytes = { version = "1", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
