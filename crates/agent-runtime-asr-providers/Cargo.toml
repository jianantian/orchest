[package]
name = "agent-runtime-asr-providers"
version = "0.1.0"
edition = "2021"

[features]
default = ["volcengine", "aliyun"]
volcengine = []
aliyun = []
deepgram = []
elevenlabs = []
soniox = []
assemblyai = []
speechmatics = []

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
bytes = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
metrics = "0.24"
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
flate2 = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[example]]
name = "asr_full_duplex"
path = "../../examples/rust/asr/asr_full_duplex.rs"

[[example]]
name = "asr_segmented"
path = "../../examples/rust/asr/asr_segmented.rs"

[[example]]
name = "asr_transcribe"
path = "../../examples/rust/asr/asr_transcribe.rs"

[[example]]
name = "volcengine_realtime_live"
path = "../../examples/rust/asr/volcengine_realtime_live.rs"
required-features = ["volcengine"]

[lints]
workspace = true
