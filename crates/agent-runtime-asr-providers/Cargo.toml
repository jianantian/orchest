[package]
name = "agent-runtime-asr-providers"
version = "0.1.0"
edition = "2021"

[features]
default = ["volcengine", "aliyun"]
volcengine = []
aliyun = []

[dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
bytes = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
metrics = "0.24"
toml = "0.8"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
