[package]
name = "orchest-py"
version = "0.1.0"
edition = "2021"
# Binding packages are out of v1.0 scope (ADR-0003 D2).
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
orchest = { path = "../orchest" }
orchest-protocol = { path = "../orchest-protocol" }
orchest-provider = { path = "../orchest-provider", features = ["llm", "asr", "decision"] }
bytes = "1"
pyo3 = { version = "0.28", features = ["py-clone"] }
async-trait = "0.1"
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
