[package]
name = "agent-runtime-providers"
version = "0.1.0"
edition = "2021"

# Deprecated re-export shell (v0.9.12): the LLM adapters live in
# orchest-provider-http now; this crate only re-exports them for core/node/py.
# Removed in Issue 008.

[dependencies]
orchest-provider-http = { path = "../orchest-provider-http" }

[dev-dependencies]
agent-runtime-core = { path = "../agent-runtime-core" }
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[example]]
name = "rust_provider_runtime_deepseek"
path = "../../examples/rust/providers/deepseek.rs"

[[example]]
name = "rust_provider_runtime_openrouter"
path = "../../examples/rust/providers/openrouter.rs"

[lints]
workspace = true
