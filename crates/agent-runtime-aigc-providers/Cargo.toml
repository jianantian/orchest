[package]
name = "agent-runtime-aigc-providers"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tracing = "0.1"
metrics = "0.24"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
base64 = "0.22"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "aigc_image_url_delivery"
path = "../../examples/rust/aigc/image_url_delivery.rs"

[[example]]
name = "aigc_image_base64_delivery"
path = "../../examples/rust/aigc/image_base64_delivery.rs"

[[example]]
name = "aigc_image_resolve_asset"
path = "../../examples/rust/aigc/image_resolve_asset.rs"

[lints]
workspace = true
