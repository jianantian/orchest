[package]
name = "agent-runtime-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent-runtime-core = { path = "../agent-runtime-core" }
agent-runtime-providers = { path = "../agent-runtime-providers" }
napi = { version = "2", features = ["napi8", "serde-json"] }
napi-derive = "2"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
napi-build = "2"
