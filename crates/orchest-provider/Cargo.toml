[package]
name = "orchest-provider"
description = "Provider registry for Orchest: select LLM, ASR, TTS, realtime and generation providers by capability or identity."
readme = "README.md"
keywords = ["agent", "llm", "provider", "asr", "tts"]
categories = ["artificial-intelligence", "api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# THE WALL: the consumer-facing registry + vendor facade + feature flags
# (v0.9.12 provider unification, Issue 004). Consumers depend on exactly
# orchest-protocol + orchest-provider; impl crates and wire dialects are never
# named. Concrete provider registrations + per-vendor feature/facade rows are
# added by Issues 005/006/007.

[features]
# Mechanism-only by default: zero registered impls, no impl crate pulled in.
default = []

# Impl-crate weight tiers (each pulls one dialect crate).
http = ["dep:orchest-provider-http"]
stream = ["dep:orchest-provider-stream"]
visual = ["dep:orchest-provider-visual"]

# Capability convenience aliases (map to the weight tiers that host them).
# `llm` pulls only the REST tier — no websocket/OSS deps.
llm = ["http"]
decision = ["http"]
asr = ["http", "stream"]
tts = ["http", "stream"]
realtime = ["stream"]
gen = ["http", "visual"]

# Deterministic in-process `Asr`/`Tts` fakes (`fakes` module) for downstream
# crates that need offline tests/demos without writing their own test double
# (issue #196). Not part of any weight tier — no impl crate, no network deps.
testing = ["dep:async-trait", "dep:bytes"]

[dependencies]
orchest-protocol = { workspace = true }
orchest-provider-core = { workspace = true }
serde_json = "1"

orchest-provider-http = { workspace = true, optional = true }
orchest-provider-stream = { workspace = true, optional = true }
orchest-provider-visual = { workspace = true, optional = true }

async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

[lints]
workspace = true
