[package]
name = "orchest-provider-core"
version = "0.1.0"
edition = "2021"

# L0 building blocks + L1 header-auth strategies + cross-cutting services for the
# provider impl crates (v0.9.12 provider unification, Issue 003). Weight-gated:
# the default feature set pulls no websocket / OSS-signing dependencies so a
# pure-REST consumer stays light.

[features]
default = ["sse"]
# SSE line decoding (REST/SSE dialects). Light — no extra heavy deps.
sse = []
# Bidirectional websocket scaffold + binary-frame codec (openspeech/minimax-ws).
# Pulls tokio-tungstenite.
ws = ["dep:tokio-tungstenite", "dep:futures-util"]
# OSS upload + signed-gen (AK/SK-HMAC / OSS-signature) auth + gen-task poller.
# Pulls the signing crates.
oss = ["dep:hmac", "dep:sha2", "dep:hex", "dep:base64"]

[dependencies]
orchest-protocol = { path = "../orchest-protocol" }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# --- weight-gated (ws) ---
tokio-tungstenite = { version = "0.24", features = ["native-tls"], optional = true }
futures-util = { version = "0.3", optional = true }

# --- weight-gated (oss) ---
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }

[lints]
workspace = true
