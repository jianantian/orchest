[package]
name = "orchest-provider-stream"
description = "Internal WebSocket provider dialects for Orchest. Not for direct use: depend on orchest-provider."
readme = "README.md"
keywords = ["orchest"]
categories = ["artificial-intelligence"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# L2/L3 WebSocket dialects (openspeech[asr/tts/omni] · minimax-ws · streaming
# asr). Absorbs the realtime + asr/tts streaming crates. Skeleton created in
# Issue 004; dialect modules added in Issue 006. WS weight tier — enables core's
# `ws` feature.

[features]
default = []

[dependencies]
orchest-protocol = { workspace = true }
orchest-provider-core = { workspace = true, features = ["ws"] }
base64 = "0.22"
flate2 = "1"
hex = "0.4"
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
