[package]
name = "agent-runtime-py"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
agent-runtime-core = { path = "../agent-runtime-core" }
orchest-providers = { path = "../orchest-providers", features = ["llm"] }
pyo3 = { version = "0.28", features = ["py-clone"] }
async-trait = "0.1"
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
