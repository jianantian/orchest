[package]
name = "agent-runtime-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde_yaml = "0.9"
which = "7"
sha2 = "0.10"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
agent-runtime-model = { path = "../agent-runtime-model" }
tracing = "0.1"
metrics = "0.24"
tiktoken-rs = "0.6"
httparse = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
agent-runtime-providers = { path = "../agent-runtime-providers" }
ractor = { version = "0.15", features = ["message_span_propogation"] }

[[test]]
name = "ractor_poc"
path = "tests/ractor_poc.rs"

[[example]]
name = "rust_deep_research_agent"
path = "../../examples/rust/deep_research_agent.rs"

[lints]
workspace = true
