[package]
name = "agent-runtime-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde_yaml = "0.9"
which = "7"
sha2 = "0.10"
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
agent-runtime-model = { path = "../agent-runtime-model" }
tracing = "0.1"
metrics = "0.24"
tiktoken-rs = "0.6"
httparse = "1"
ractor = { version = "0.15", features = ["message_span_propogation"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }

[features]
sqlite-session = ["dep:rusqlite"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
agent-runtime-providers = { path = "../agent-runtime-providers" }

[[test]]
name = "ractor_poc"
path = "tests/ractor_poc.rs"

[[example]]
name = "basic_agent_run"
path = "../../examples/rust/basic_agent_run.rs"

[[example]]
name = "rust_deep_research_agent"
path = "../../examples/rust/deep_research_agent.rs"

[[example]]
name = "hook_logging"
path = "../../examples/rust/hook_logging.rs"

[[example]]
name = "hook_modifier"
path = "../../examples/rust/hook_modifier.rs"

[[example]]
name = "hook_abort"
path = "../../examples/rust/hook_abort.rs"

[[example]]
name = "agent_as_tool"
path = "../../examples/rust/agent_as_tool.rs"

[[example]]
name = "handoff_routing"
path = "../../examples/rust/handoff_routing.rs"

[[example]]
name = "handoff_input_filter"
path = "../../examples/rust/handoff_input_filter.rs"

[[example]]
name = "retry_exhausted"
path = "../../examples/rust/retry_exhausted.rs"

[[example]]
name = "loop_detection"
path = "../../examples/rust/loop_detection.rs"

[[example]]
name = "guardrail_keyword_filter"
path = "../../examples/rust/guardrail_keyword_filter.rs"

[[example]]
name = "guardrail_output_sanitize"
path = "../../examples/rust/guardrail_output_sanitize.rs"

[[example]]
name = "approval_mode_side_effect"
path = "../../examples/rust/approval_mode_side_effect.rs"

[[example]]
