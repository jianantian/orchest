[package]
name = "orchest-provider-visual"
version = "0.1.0"
edition = "2021"

# L2/L3 signed/polled generation (volc-visual · aliyun · crazyrouter · renderful).
# Absorbs the aigc image/video gen. Skeleton created in Issue 004; GenTask impls
# added in Issue 007. Enables core's `oss` feature (signing + poller).

[features]
default = []

[dependencies]
orchest-protocol = { path = "../orchest-protocol" }
orchest-provider-core = { path = "../orchest-provider-core", features = ["oss"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
