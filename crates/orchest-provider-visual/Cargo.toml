[package]
name = "orchest-provider-visual"
description = "Internal signed/polled generation dialects for Orchest. Not for direct use: depend on orchest-provider."
readme = "README.md"
keywords = ["orchest"]
categories = ["artificial-intelligence"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# L2/L3 signed/polled generation (volc-visual · aliyun · crazyrouter · renderful).
# Absorbs the aigc image/video gen. Skeleton created in Issue 004; GenTask impls
# added in Issue 007. Enables core's `oss` feature (signing + poller).

[features]
default = []

[dependencies]
orchest-protocol = { workspace = true }
orchest-provider-core = { workspace = true, features = ["oss"] }
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
