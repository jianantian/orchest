[package]
name = "orchest-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
orchest = { path = "../orchest" }
orchest-protocol = { path = "../orchest-protocol" }
orchest-provider = { path = "../orchest-provider", features = ["llm", "asr"] }
bytes = "1"
napi = { version = "2", features = ["napi8", "serde-json", "tokio_rt"] }
napi-derive = "2"
async-trait = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
