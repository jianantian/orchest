[package]
name = "orchest-provider-http"
description = "Internal REST/SSE provider dialects for Orchest. Not for direct use: depend on orchest-provider."
readme = "README.md"
keywords = ["orchest"]
categories = ["artificial-intelligence"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# L2/L3 REST + SSE dialects. Home of the LLM chat adapters (openai-compat ·
# anthropic · minimax-rest · volc-ark), migrated from agent-runtime-providers in
# Issue 005. REST one-shot asr/tts (006) and minimax-music gen-task (007) follow.
# Light weight tier — REST only, no websocket/OSS.

[dependencies]
orchest-protocol = { workspace = true }
orchest-provider-core = { workspace = true }
tokio = { version = "1", features = ["sync", "rt"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
async-trait = "0.1"
bytes = "1"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"
metrics = "0.24"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "registry"] }
metrics-util = "0.20"

[lints]
workspace = true
